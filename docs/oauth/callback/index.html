<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roblox Open Cloud Authorization</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 420px; border: 1px solid #334155; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .status { margin-top: 1.5rem; padding: 0.75rem; background: #064e3b; color: #6ee7b7; border-radius: 8px; font-weight: 500; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Authorization Successful</h1>
    <p>Your Roblox Open Cloud OAuth 2.0 authorization has been received.</p>
    <div class="status">✓ You may close this window.</div>
  </div>
</body>
</html>
