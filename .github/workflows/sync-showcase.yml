name: Auto-Update TomiHub Showcase

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TomiHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Latest Activity & Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
          const fs = require("fs");
          async function fetchAll() {
            const headers = {
              "User-Agent": "TomiHub-Showcase-Sync",
              "Authorization": process.env.GITHUB_TOKEN ? `Bearer ${process.env.GITHUB_TOKEN}` : ""
            };
            try {
              const resRepos = await fetch("https://api.github.com/users/warpusTOM/repos?sort=pushed&per_page=30", { headers });
              const repos = await resRepos.json();

              const resEvents = await fetch("https://api.github.com/users/warpusTOM/events/public?per_page=30", { headers });
              const events = await resEvents.json();

              const data = {
                updatedAt: new Date().toISOString(),
                repos: Array.isArray(repos) ? repos.filter(r => !r.fork).map(r => ({
                  name: r.name,
                  description: r.description,
                  url: r.html_url,
                  stars: r.stargazers_count,
                  language: r.language,
                  pushedAt: r.pushed_at,
                  isPrivate: r.private
                })) : [],
                recentEvents: Array.isArray(events) ? events.slice(0, 10).map(e => ({
                  type: e.type,
                  repo: e.repo ? e.repo.name : "",
                  createdAt: e.created_at
                })) : []
              };

              fs.writeFileSync("./docs/github-data.json", JSON.stringify(data, null, 2));
              console.log("Successfully wrote github-data.json with " + data.repos.length + " repos.");
            } catch (err) {
              console.error("Error fetching data:", err);
            }
          }
          fetchAll();
          '

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/github-data.json
          if git diff --staged --quiet; then
            echo "No changes detected in GitHub data."
          else
            git commit -m "chore(showcase): auto-sync latest GitHub projects and activity [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
